app-id: fm.reaper.Reaper
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags:
  - proprietary
command: reaper

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --device=all
  - --filesystem=home

add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-dirs: lv2;clap;vst;vst3
    subdirectories: true
    no-autodownload: true

modules:
  - name: libxml2
    config-opts:
      - --without-python
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
        sha256: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
        x-checker-data:
          type: anitya
          project-id: 1783
          stable-only: true
          url-template: https://download.gnome.org/sources/libxml2/$major.$minor/libxml2-$version.tar.xz

  - name: reaper
    buildsystem: simple
    build-commands:
      # Install script to extract tarball
      - install -D apply_extra /app/bin/apply_extra
      # Install wrapper script to run application
      - install -D reaper /app/bin/reaper
      # Add icon
      - install -Dm644 main.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      # Add desktop integration
      - install -Dm644 fm.reaper.Reaper.desktop /app/share/applications/${FLATPAK_ID}.desktop
      # Install flatpak metadata
      - install -Dm644 fm.reaper.Reaper.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      # extensions
      - install -d /app/extensions/Plugins
      - install -d /app/lib/ffmpeg
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          # Extract downnloaded tarball
          - mkdir -p export/share
          - tar xf reaper.tar.xz -C /app/extra/export/share
          - rm -f reaper.tar.xz
          # Run installer script
          - cd export/share/reaper_linux_*
          - ./install-reaper.sh --quiet --install /app/extra
          # Clean up temp tiles
          - cd ../../../
          - rm -rf /app/extra/export/share/reaper_linux_*
      - type: extra-data
        filename: reaper.tar.xz

        url: https://www.reaper.fm/files/7.x/reaper786_linux_x86_64.tar.xz
        sha256: c2f9d8616bd1dc6175993b82451e1c6e352c6761e7ae6d72400a3f3dfb03bedb
        size: 13833432
        only-arches: [x86_64]

        x-checker-data:
          type: html
          url: https://www.reaper.fm/download.php
          version-pattern: "<div class='hdrbottom'>Version ([\\d\\.-]*):"
          url-template: https://www.reaper.fm/files/7.x/reaper${major}${minor}_linux_x86_64.tar.xz

      - type: extra-data
        filename: reaper.tar.xz
        url: https://www.reaper.fm/files/7.x/reaper786_linux_aarch64.tar.xz
        sha256: 5b33b51db5dac1f74172b449eb765b9778df4dbdcb164d930a947d8cb3476656
        size: 12424104
        only-arches: [aarch64]

        x-checker-data:
          type: html
          url: https://www.reaper.fm/download.php
          version-pattern: "<div class='hdrbottom'>Version ([\\d\\.-]*):"
          url-template: https://www.reaper.fm/files/7.x/reaper${major}${minor}_linux_aarch64.tar.xz

      - type: script
        dest-filename: reaper
        commands:
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - export CLAP_PATH=/app/extensions/Plugins/clap
          - export VST_PATH=/app/extensions/Plugins/vst
          - export VST3_PATH=/app/extensions/Plugins/vst3
          - exec /app/extra/REAPER/reaper "$@"
      - type: file
        path: fm.reaper.Reaper.desktop
      - type: file
        path: fm.reaper.Reaper.metainfo.xml
      - type: file
        path: main.png
